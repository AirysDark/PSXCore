[package]
name = "psxcore-control"
version = "0.1.0"
description = "PSXCore Windows and Android control client"
authors = ["AirysDark"]
edition = "2021"

[lib]
name = "psxcore_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
