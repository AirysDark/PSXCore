; PSXCore supports both ESP32-S3 boards.
; Safe boot configuration: validate memory/runtime before enabling peripherals.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_unflags =
  -std=gnu++11

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -std=gnu++17
  -include Arduino.h

lib_deps =
  lemmingDev/ESP32-BLE-Gamepad
  h2zero/NimBLE-Arduino@^2.1.0

monitor_filters =
  esp32_exception_decoder

board_build.f_cpu = 240000000L
board_build.filesystem = spiffs

; Full-size ESP32-S3 DevKitC
; 4 MB flash configuration.
[env:esp32-s3]
board = esp32-s3-devkitc-1
upload_port = COM7
monitor_port = COM7
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv

; ESP32-S3-Tiny FH4R2
; 4 MB flash + 2 MB QSPI PSRAM.
[env:esp32-s3-tiny]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions_tiny.csv
